name: 재고 대시보드 자동 업데이트
 
on:
  push:
    paths:
      - '**.xlsx'
      - 'index.html'
      - 'generate.py'
 
jobs:
  update-dashboard:
    runs-on: ubuntu-latest
 
    permissions:
      contents: write
 
    steps:
      - name: 저장소 체크아웃
  uses: actions/checkout@v4
  with:
    fetch-depth: 0

- name: 파일 수정시간 복원
  run: |
    git ls-files | while read f; do
      t=$(git log -1 --format="%ct" -- "$f")
      touch -t $(date -d "@$t" +%Y%m%d%H%M.%S) "$f"
    done
 
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: 필요 패키지 설치
        run: pip install openpyxl
 
      - name: 대시보드 생성
        run: python generate.py
 
      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🔄 재고 대시보드 자동 업데이트 $(date +'%Y-%m-%d')"
          git push

